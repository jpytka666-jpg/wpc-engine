[workspace]
resolver = "2"
members = [
    "wpc-format",
    "wpc-eval", "wpc-core", "wpc-compiler",
    "wpc-runtime",
    "modules/memory-kv",
    "modules/memory-graph",
    "modules/studio",
    "modules/aions-kernel",
    "modules/ghost-gate",
    "modules/os-integration",
    "modules/organism-smoke",
    "modules/agents-ci",
    "modules/wpc-readonly-bridge",
]
exclude = [
    "wpc-engine",  # C++ lives here, not a Rust crate
]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
