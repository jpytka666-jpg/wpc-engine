name: Stage 2 Contract Gate
on:
  push:
    branches: ["stage2/ghost-gate-contracts"]
  pull_request:
    branches: ["arch/ghost-gate"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f CLAUDE.md && test -f docs/MODULE-CONTRACT.md && test -f docs/IMPLEMENTATION-STAGE-1.md
      - name: Validate JSON
        shell: python
        run: |
          import json
          from pathlib import Path
          files = list(Path('modules/ghost-gate').glob('*.json'))
          assert files
          for p in files:
              json.loads(p.read_text(encoding='utf-8'))
              print('VALID', p)
