name: Ghost Gate Contract Gate

on:
  push:
    branches: ["stage2/ghost-gate-contracts"]
  pull_request:
    branches: ["arch/ghost-gate"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Ghost Gate policy
        run: cargo test -p aions-ghost-gate-contract
