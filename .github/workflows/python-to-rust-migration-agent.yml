name: AIONS CI Repair Agent

on:
  workflow_dispatch:

concurrency:
  group: aions-ci-repair-integration
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/full-organism-v2
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Apply Clippy autofixes
        run: |
          set -euo pipefail
          cargo clippy --fix \
            --workspace \
            --all-targets \
            --all-features \
            --release \
            --allow-dirty \
            --allow-staged

      - name: Apply deterministic cleanup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_if_present(text, old, new, label):
              if old not in text:
                  print(f"Cleanup pattern already absent or previously fixed: {label}")
                  return text
              return text.replace(old, new, 1)

          kernel_path = Path("wpc-eval/src/fused_kernel.rs")
          text = kernel_path.read_text()
          text = text.replace("\r\n", "\n").replace("\r", "\n")
          duplicate = "#[allow(dead_code)]\n#[allow(dead_code)]"
          while duplicate in text:
              text = text.replace(duplicate, "#[allow(dead_code)]")

          text = text.replace(
              "            for i in 0..BLOCK_SIZE_V2 {\n                codes[i] = ((i + bi * 13) % 64) as u8;\n            }",
              "            for (i, code) in codes.iter_mut().enumerate() {\n                *code = ((i + bi * 13) % 64) as u8;\n            }",
          )
          text = text.replace(
              "            for i in 0..BLOCK_SIZE_V4 {\n                codes[i] = ((i * 3 + bi * 5) % 16) as u8;\n            }",
              "            for (i, code) in codes.iter_mut().enumerate() {\n                *code = ((i * 3 + bi * 5) % 16) as u8;\n            }",
          )
          kernel_path.write_text(text)

          def rewrite_assign_loops(text, width):
              pattern = rf"(?m)^(?P<indent>[ ]*)for i in 0\.\.{width} \{{\r?\n(?P=indent)    (?P<array>codes|weights)\[i\] = (?P<expr>[^\n]+);\r?\n(?P=indent)\}}"

              def repl(match):
                  indent = match.group("indent")
                  array = match.group("array")
                  expr = match.group("expr")
                  return (
                      f"{indent}for (i, item) in {array}.iter_mut().enumerate().take({width}) {{\n"
                      f"{indent}    *item = {expr};\n"
                      f"{indent}}}"
                  )

              return re.sub(pattern, repl, text)

          core_path = Path("wpc-core/src/quant_encoder.rs")
          core = core_path.read_text().replace("\r\n", "\n").replace("\r", "\n")
          core = rewrite_assign_loops(core, "BLOCK_SIZE_V2")
          core = rewrite_assign_loops(core, "BLOCK_SIZE_V4")

          core = replace_if_present(
              core,
              """        for i in 0..BLOCK_SIZE_V2 {\n            weights[i] = i as f32 * 0.05 - 3.2; // ramp from -3.2 to 3.2\n        }""",
              """        for (i, weight) in weights.iter_mut().enumerate() {\n            *weight = i as f32 * 0.05 - 3.2; // ramp from -3.2 to 3.2\n        }""",
              "v2 ramp fixture",
          )

          core = replace_if_present(
              core,
              """        for ((i, &code), (&weight, reconstructed_value)) in block\n            .codes\n            .iter()\n            .enumerate()\n            .zip(weights.iter().zip(reconstructed.iter_mut()))\n        {""",
              """        for (&code, (&weight, reconstructed_value)) in block\n            .codes\n            .iter()\n            .zip(weights.iter().zip(reconstructed.iter_mut()))\n        {""",
              "affine reconstruction loop",
          )

          core = replace_if_present(
              core,
              """        for i in 0..BLOCK_SIZE_V2 {\n            let a = zp + v2_codes[i] as f32 * sc;\n            let b = zp + unpacked[i] as f32 * sc;\n            assert_eq!(a.to_bits(), b.to_bits(), \"value {i} differs\");\n        }""",
              """        for (i, (&v2_code, &unpacked_code)) in v2_codes.iter().zip(unpacked.iter()).enumerate() {\n            let a = zp + v2_code as f32 * sc;\n            let b = zp + unpacked_code as f32 * sc;\n            assert_eq!(a.to_bits(), b.to_bits(), \"value {i} differs\");\n        }""",
              "v3 decoded-value comparison",
          )

          core = replace_if_present(
              core,
              """        for i in 0..BLOCK_SIZE_V2 {\n            let decoded = zp + block.codes[i] as f32 * scale;\n            reconstructed[i] = decoded;\n            let error = (decoded - weights[i]).abs();\n            sum_sq_error += error * error;\n            sum_sq_original += weights[i].abs().max(1e-6) * weights[i].abs().max(1e-6);\n        }""",
              """        for ((&code, &weight), reconstructed_value) in block\n            .codes\n            .iter()\n            .zip(weights.iter())\n            .zip(reconstructed.iter_mut())\n        {\n            let decoded = zp + code as f32 * scale;\n            *reconstructed_value = decoded;\n            let error = (decoded - weight).abs();\n            sum_sq_error += error * error;\n            sum_sq_original += weight.abs().max(1e-6) * weight.abs().max(1e-6);\n        }""",
              "affine reconstruction check",
          )

          core = replace_if_present(
              core,
              """        for i in 0..BLOCK_SIZE_V4 {\n            let decoded = zp + codes[i] as f32 * sc;\n            let err = (decoded - weights[i]).abs();\n            // Half a step, plus slack for zero_point/scale themselves being f16.\n            assert!(\n                err <= sc * 0.5 + sc * 0.05 + 1e-6,\n                \"value {i}: |{decoded} - {}| = {err} exceeds half a step ({})\",\n                weights[i],\n                sc * 0.5\n            );\n        }""",
              """        for (i, (&code, &weight)) in codes.iter().zip(weights.iter()).enumerate() {\n            let decoded = zp + code as f32 * sc;\n            let err = (decoded - weight).abs();\n            // Half a step, plus slack for zero_point/scale themselves being f16.\n            assert!(\n                err <= sc * 0.5 + sc * 0.05 + 1e-6,\n                \"value {i}: |{decoded} - {weight}| = {err} exceeds half a step ({})\",\n                sc * 0.5\n            );\n        }""",
              "v4 bounded reconstruction check",
          )

          core = replace_if_present(
              core,
              """        for i in 0..BLOCK_SIZE_V4 {\n            let d3 = v3_zp.to_f32() + v3_codes[i] as f32 * v3_sc.to_f32() - weights[i];\n            let d4 = v4_zp.to_f32() + v4_codes[i] as f32 * v4_sc.to_f32() - weights[i];\n            e3 += d3 * d3;\n            e4 += d4 * d4;\n        }""",
              """        for ((&v3_code, &v4_code), &weight) in v3_codes\n            .iter()\n            .zip(v4_codes.iter())\n            .zip(weights.iter())\n        {\n            let d3 = v3_zp.to_f32() + v3_code as f32 * v3_sc.to_f32() - weight;\n            let d4 = v4_zp.to_f32() + v4_code as f32 * v4_sc.to_f32() - weight;\n            e3 += d3 * d3;\n            e4 += d4 * d4;\n        }""",
              "v3/v4 RMSE comparison",
          )
          core_path.write_text(core)

          format_path = Path("wpc-format/src/lib.rs")
          fmt = format_path.read_text().replace("\r\n", "\n").replace("\r", "\n")
          fmt = rewrite_assign_loops(fmt, "128")
          fmt = rewrite_assign_loops(fmt, "BLOCK_SIZE_V4")
          format_path.write_text(fmt)

          main_path = Path("wpc-eval/src/main.rs")
          main = main_path.read_text().replace("\r\n", "\n").replace("\r", "\n")
          main = main.replace(
              "use wpc_format::{CompressedBlock, BLOCK_SIZE};",
              "use wpc_format::BLOCK_SIZE;",
          )
          main = main.replace(
              '#[cfg(target_arch = "x86_64")]\nuse std::arch::x86_64::*;\n\n',
              "",
          )
          main_path.write_text(main)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Validate build
        run: cargo build --workspace --release

      - name: Validate tests
        run: cargo test --workspace --release

      - name: Validate full Clippy gate
        run: cargo clippy --workspace --all-targets --all-features --release -- -D warnings

      - name: Detect verified repair changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist verified repair changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[ai-repair] persist verified Rust CI cleanup"
          git push origin HEAD:integration/full-organism-v2

      - name: Dispatch verification workflows
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref integration/full-organism-v2
          gh workflow run full-organism-build.yml --repo "$GITHUB_REPOSITORY" --ref integration/full-organism-v2
          gh workflow run unified-organism.yml --repo "$GITHUB_REPOSITORY" --ref integration/full-organism-v2
          gh workflow run full-organism-gate.yml --repo "$GITHUB_REPOSITORY" --ref integration/full-organism-v2

      - name: Final status
        run: git status --short --branch
