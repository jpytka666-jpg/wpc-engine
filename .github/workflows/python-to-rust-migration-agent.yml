name: AIONS CI Repair Agent

on:
  push:
    branches: ["integration/full-organism-v2"]
  workflow_dispatch:

concurrency:
  group: aions-ci-repair-integration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[ai-repair]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/full-organism-v2
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Apply Clippy autofixes
        run: |
          set -euo pipefail
          cargo clippy --fix \
            --workspace \
            --all-targets \
            --all-features \
            --release \
            --allow-dirty \
            --allow-staged

      - name: Apply deterministic Clippy cleanup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("wpc-eval/src/fused_kernel.rs")
          text = path.read_text()

          replacements = {
              """        for i in 0..BLOCK_SIZE_V2 {\n            codes[i] = (i % 64) as u8;\n        }\n""": """        for (i, code) in codes.iter_mut().enumerate().take(BLOCK_SIZE_V2) {\n            *code = (i % 64) as u8;\n        }\n""",
              """        for i in 0..BLOCK_SIZE_V2 {\n            x[i] = (i as f32 * 0.01 - 0.5) % 1.0;\n        }\n""": """        for (i, value) in x.iter_mut().enumerate().take(BLOCK_SIZE_V2) {\n            *value = (i as f32 * 0.01 - 0.5) % 1.0;\n        }\n""",
              """        for i in 0..10 {\n            x[i] = 2.0;\n        }\n""": """        for value in x.iter_mut().take(10) {\n            *value = 2.0;\n        }\n""",
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)

          text = text.replace(
              """        for i in 0..BLOCK_SIZE_V2 {\n            let w = zp + block.codes[i] as f32 * scale;\n""",
              """        for (i, &code) in block.codes.iter().enumerate().take(BLOCK_SIZE_V2) {\n            let w = zp + code as f32 * scale;\n""",
          )

          path.write_text(text)

          main = Path("wpc-eval/src/main.rs")
          text = main.read_text()
          text = text.replace("use wpc_format::{CompressedBlock, BLOCK_SIZE};", "use wpc_format::BLOCK_SIZE;")
          text = text.replace("#[cfg(target_arch = \"x86_64\")]\nuse std::arch::x86_64::*;\n\n", "")
          text = text.replace(
              """    for i in 0..n_blocks {\n        let b = &blocks[i];\n""",
              """    for (i, b) in blocks.iter().enumerate().take(n_blocks) {\n""",
          )
          main.write_text(text)

          kernel = path.read_text()
          for fn_name in [
              "matvec_v2_fused",
              "matvec_v2_scalar",
              "matvec_v3_fused",
              "matvec_v3_scalar",
              "matvec_v4_fused",
              "matvec_v4_scalar",
          ]:
              marker = f"pub unsafe fn {fn_name}" if fn_name.endswith("fused") else f"pub fn {fn_name}"
              if marker in kernel:
                  kernel = kernel.replace(marker, f"#[expect(dead_code)]\n{marker}", 1)
          path.write_text(kernel)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Validate build
        run: cargo build --workspace --release

      - name: Validate tests
        run: cargo test --workspace --release

      - name: Validate full Clippy gate
        run: cargo clippy --workspace --all-targets --all-features --release -- -D warnings

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No repair changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[ai-repair] apply deterministic Clippy fixes"
          git push origin HEAD:integration/full-organism-v2
