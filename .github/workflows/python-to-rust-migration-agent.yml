name: AIONS Python to Rust Migration Agent

on:
  workflow_dispatch:

# Copilot automation is intentionally disconnected. CI repairs are now
# performed and validated explicitly rather than consuming Copilot quota
# on every push to the integration branch.
permissions:
  contents: write

jobs:
  migrate-and-debug:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Copilot migration agent disabled; repairs are performed explicitly."
