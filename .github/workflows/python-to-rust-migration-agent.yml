name: AIONS Python to Rust Migration Agent

on:
  push:
    branches: ["integration/full-organism-v2"]
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

jobs:
  migrate-and-debug:
    if: ${{ !contains(github.event.head_commit.message, '[ai-migration]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/full-organism-v2
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python for parity checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inventory Python code
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Python files ==="
          find . -type f -name '*.py' -not -path './.git/*' -print | sort
          echo "=== Python line counts ==="
          find . -type f -name '*.py' -not -path './.git/*' -print0 \
            | xargs -0 -r wc -l | sort -n

      - name: Baseline Rust validation
        run: |
          cargo build --workspace --release
          cargo test --workspace --release
          cargo fmt --all --check

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Run Copilot migration/debug agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -d '' PROMPT <<'COPILOT_PROMPT' || true
          You are the senior migration engineer for jpytka666-jpg/wpc-engine.

          Work ONLY on branch integration/full-organism-v2. Never touch main.
          Move appropriate executable/runtime Python logic to Rust, fix current Rust
          CI blockers, preserve behavior, and add focused tests.

          SAFETY RULES:
          - Do NOT blindly translate every Python line into Rust.
          - Do NOT delete Python just to make CI green.
          - Do NOT weaken, skip, or remove tests.
          - Do NOT change architecture/contracts merely to silence errors.
          - Do NOT modify main or another branch.
          - Do NOT rewrite model artifacts, binaries, or generated output into git.
          - Preserve public CLI/API behavior for runtime-facing code.
          - Prefer small validated migrations over one giant rewrite.

          First inventory all *.py files and classify each as runtime logic, tests/diagnostics,
          or build/download/CI/dev tooling. Migrate only useful runtime/test logic; retain tooling
          Python when appropriate and document why.

          CURRENT KNOWN CLIPPY BLOCKERS — FIX, DON'T SUPPRESS:
          - wpc-runtime/src/gemma4_model.rs: needless_range_loop, excessive_precision.
          - wpc-runtime/src/model.rs: needless_range_loop.
          - wpc-runtime/src/qwen3_moe_model.rs: needless_range_loop.
          - wpc-runtime/src/weights.rs: chunks_exact_to_as_chunks.
          - wpc-runtime/src/wpc_weights.rs: chunks_exact_to_as_chunks.
          - wpc-runtime/src/wpc_weights_v2.rs: unused shape metadata; justify narrowly or use it.
          - wpc-runtime/src/forward_batch.rs: too_many_arguments and raw-pointer safety lint.
          - modules/memory-kv/benches/hot_kv.rs: unit_arg benchmark lint.

          Run this exact command yourself and keep fixing until it exits 0:
          cargo clippy --workspace --all-targets --all-features --release -- -D warnings
          Do not pipe it through grep/head or otherwise hide its exit status.

          Required validation before declaring success:
          cargo fmt --all --check
          cargo build --workspace --release
          cargo test --workspace --release
          cargo clippy --workspace --all-targets --all-features --release -- -D warnings

          Keep docs/python-to-rust-migration.md concise and current. Include files inspected,
          migrations completed, files retained, tests run, failures, and remaining work.

          Commit ONLY validated changes directly to integration/full-organism-v2.
          Every agent commit MUST start with [ai-migration]. Do not commit speculative changes.
          COPILOT_PROMPT
          copilot --yolo -p "$PROMPT"

      - name: Final Rust validation
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo build --workspace --release
          cargo test --workspace --release
          cargo clippy --workspace --all-targets --all-features --release -- -D warnings

      - name: Commit any validated uncommitted fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No uncommitted changes remain."
            exit 0
          fi
          git add -A
          git commit -m "[ai-migration] validate migration fixes"
          git push origin HEAD:integration/full-organism-v2
