name: AIONS CI Repair Agent

on:
  push:
    branches: ["integration/full-organism-v2"]
  workflow_dispatch:

concurrency:
  group: aions-ci-repair-integration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[ai-repair]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/full-organism-v2
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Apply Clippy autofixes
        run: |
          set -euo pipefail
          cargo clippy --fix \
            --workspace \
            --all-targets \
            --all-features \
            --release \
            --allow-dirty \
            --allow-staged

      - name: Apply deterministic Clippy cleanup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_or_fail(path: Path, pattern: str, replacement: str, label: str, flags: int = 0) -> None:
              text = path.read_text()
              new, count = re.subn(pattern, replacement, text, flags=flags)
              if count == 0:
                  raise SystemExit(f"deterministic cleanup did not match: {path}: {label}")
              path.write_text(new)

          kernel = Path("wpc-eval/src/fused_kernel.rs")
          replace_or_fail(
              kernel,
              r"for i in 0\.\.BLOCK_SIZE_V2 \{\n\s*codes\[i\] = \(i % 64\) as u8;.*\n\s*\}",
              "for (i, code) in codes.iter_mut().enumerate().take(BLOCK_SIZE_V2) {\n            *code = (i % 64) as u8;\n        }",
              "v2 varied codes",
          )
          replace_or_fail(
              kernel,
              r"for i in 0\.\.BLOCK_SIZE_V2 \{\n\s*x\[i\] = \(i as f32 \* 0\.01 - 0\.5\) % 1\.0;.*\n\s*\}",
              "for (i, value) in x.iter_mut().enumerate().take(BLOCK_SIZE_V2) {\n            *value = (i as f32 * 0.01 - 0.5) % 1.0;\n        }",
              "v2 varied activations",
          )
          replace_or_fail(
              kernel,
              r"for i in 0\.\.10 \{\n\s*x\[i\] = 2\.0;\n\s*\}",
              "for value in x.iter_mut().take(10) {\n            *value = 2.0;\n        }",
              "v2 scalar first ten",
          )
          replace_or_fail(
              kernel,
              r"for i in 0\.\.BLOCK_SIZE_V2 \{\n\s*let w = zp \+ block\.codes\[i\] as f32 \* scale;\n\s*expected \+= w \* x\[i\];\n\s*\}",
              "for (i, &code) in block.codes.iter().enumerate().take(BLOCK_SIZE_V2) {\n            let w = zp + code as f32 * scale;\n            expected += w * x[i];\n        }",
              "v2 reference",
          )
          replace_or_fail(
              kernel,
              r"for i in 0\.\.BLOCK_SIZE_V2 \{\n\s*acc \+= \(zp \+ codes\[i\] as f32 \* sc\) \* x\[bi \* BLOCK_SIZE_V2 \+ i\];\n\s*\}",
              "for (i, &code) in codes.iter().enumerate().take(BLOCK_SIZE_V2) {\n                acc += (zp + code as f32 * sc) * x[bi * BLOCK_SIZE_V2 + i];\n            }",
              "v2 multi-block reference",
          )
          replace_or_fail(
              kernel,
              r"for i in 0\.\.BLOCK_SIZE_V4 \{\n\s*acc \+= \(zp \+ codes\[i\] as f32 \* sc\) \* x\[bi \* BLOCK_SIZE_V4 \+ i\];\n\s*\}",
              "for (i, &code) in codes.iter().enumerate().take(BLOCK_SIZE_V4) {\n                acc += (zp + code as f32 * sc) * x[bi * BLOCK_SIZE_V4 + i];\n            }",
              "v4 reference",
          )
          # Remove the previously introduced expectations entirely.
          kernel.write_text(kernel.read_text().replace("#[expect(dead_code)]\n", ""))

          verify = Path("wpc-core/examples/verify_v2_rmse.rs")
          replace_or_fail(
              verify,
              r"for k in 0\.\.BLOCK_SIZE_V2 \{\n\s*let orig = block\[k\] as f64;\n\s*let approx = \(zp \+ qb\.codes\[k\] as f32 \* sc\) as f64;",
              "for (k, (&orig_code, &quant_code)) in block.iter().zip(qb.codes.iter()).enumerate().take(BLOCK_SIZE_V2) {\n                let orig = orig_code as f64;\n                let approx = (zp + quant_code as f32 * sc) as f64;",
              "rmse reference",
          )
          PY

      - name: Format
        run: cargo fmt --all

      - name: Persist validated repair inputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes to persist."
          else
            git commit -m "[ai-repair] persist deterministic Clippy fixes"
            git push origin HEAD:integration/full-organism-v2
          fi

      - name: Validate build
        run: cargo build --workspace --release

      - name: Validate tests
        run: cargo test --workspace --release

      - name: Validate full Clippy gate
        run: cargo clippy --workspace --all-targets --all-features --release -- -D warnings

      - name: Final status
        run: git status --short --branch
