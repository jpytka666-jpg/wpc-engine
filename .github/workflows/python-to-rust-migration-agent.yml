name: AIONS CI Repair Agent

on:
  push:
    branches: ["integration/full-organism-v2"]
  workflow_dispatch:

concurrency:
  group: aions-ci-repair-integration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[ai-repair]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/full-organism-v2
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Apply Clippy autofixes
        run: |
          set -euo pipefail
          cargo clippy --fix \
            --workspace \
            --all-targets \
            --all-features \
            --release \
            --allow-dirty \
            --allow-staged

      - name: Apply deterministic cleanup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          kernel_path = Path("wpc-eval/src/fused_kernel.rs")
          text = kernel_path.read_text()

          # Normalize the six intentionally-unreferenced compatibility kernels
          # to exactly one dead_code allowance. This is deliberately idempotent.
          for name in (
              "matvec_v2_fused",
              "matvec_v2_scalar",
              "matvec_v3_fused",
              "matvec_v3_scalar",
              "matvec_v4_fused",
              "matvec_v4_scalar",
          ):
              signature = (
                  f"pub unsafe fn {name}"
                  if name.endswith("fused")
                  else f"pub fn {name}"
              )
              pattern = rf"(?m)^(?:#\[(?:allow|expect)\(dead_code\)\]\r?\n)+(?={re.escape(signature)})"
              text = re.sub(pattern, "", text)
              text = text.replace(signature, f"#[allow(dead_code)]\n{signature}", 1)

          # Clippy's suggested iterator rewrite does not fire reliably on these
          # two fixture builders, so make the mechanical transformation explicit.
          text = text.replace(
              "            for i in 0..BLOCK_SIZE_V2 {\n                codes[i] = ((i + bi * 13) % 64) as u8;\n            }",
              "            for (i, code) in codes.iter_mut().enumerate().take(BLOCK_SIZE_V2) {\n                *code = ((i + bi * 13) % 64) as u8;\n            }",
          )
          text = text.replace(
              "            for i in 0..BLOCK_SIZE_V4 {\n                codes[i] = ((i * 3 + bi * 5) % 16) as u8;\n            }",
              "            for (i, code) in codes.iter_mut().enumerate().take(BLOCK_SIZE_V4) {\n                *code = ((i * 3 + bi * 5) % 16) as u8;\n            }",
          )

          kernel_path.write_text(text)

          main_path = Path("wpc-eval/src/main.rs")
          main = main_path.read_text()
          main = main.replace(
              "use wpc_format::{CompressedBlock, BLOCK_SIZE};",
              "use wpc_format::BLOCK_SIZE;",
          )
          main = main.replace(
              '#[cfg(target_arch = "x86_64")]\nuse std::arch::x86_64::*;\n\n',
              "",
          )
          main_path.write_text(main)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Validate build
        run: cargo build --workspace --release

      - name: Validate tests
        run: cargo test --workspace --release

      - name: Validate full Clippy gate
        run: cargo clippy --workspace --all-targets --all-features --release -- -D warnings

      - name: Persist validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes to persist."
          else
            git commit -m "[ai-repair] persist validated Rust CI fixes"
            git push origin HEAD:integration/full-organism-v2
          fi

      - name: Final status
        run: git status --short --branch
