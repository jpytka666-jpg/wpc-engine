name: AIONS CI Repair Agent

on:
  push:
    branches: ["integration/full-organism-v2"]
  workflow_dispatch:

concurrency:
  group: aions-ci-repair-integration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[ai-repair]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/full-organism-v2
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Apply Clippy autofixes
        run: |
          set -euo pipefail
          cargo clippy --fix \
            --workspace \
            --all-targets \
            --all-features \
            --release \
            --allow-dirty \
            --allow-staged

      - name: Apply deterministic cleanup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          kernel_path = Path("wpc-eval/src/fused_kernel.rs")
          text = kernel_path.read_text()

          # Collapse repeated dead_code attributes globally. This is idempotent
          # and works even when target_feature/doc attributes separate them from
          # the function signature.
          duplicate = "#[allow(dead_code)]\n#[allow(dead_code)]"
          while duplicate in text:
              text = text.replace(duplicate, "#[allow(dead_code)]")

          text = text.replace(
              "            for i in 0..BLOCK_SIZE_V2 {\n                codes[i] = ((i + bi * 13) % 64) as u8;\n            }",
              "            for (i, code) in codes.iter_mut().enumerate() {\n                *code = ((i + bi * 13) % 64) as u8;\n            }",
          )
          text = text.replace(
              "            for i in 0..BLOCK_SIZE_V4 {\n                codes[i] = ((i * 3 + bi * 5) % 16) as u8;\n            }",
              "            for (i, code) in codes.iter_mut().enumerate() {\n                *code = ((i * 3 + bi * 5) % 16) as u8;\n            }",
          )
          kernel_path.write_text(text)

          main_path = Path("wpc-eval/src/main.rs")
          main = main_path.read_text()
          main = main.replace(
              "use wpc_format::{CompressedBlock, BLOCK_SIZE};",
              "use wpc_format::BLOCK_SIZE;",
          )
          main = main.replace(
              '#[cfg(target_arch = "x86_64")]\nuse std::arch::x86_64::*;\n\n',
              "",
          )
          main_path.write_text(main)
          PY

      - name: Assert cleanup invariants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path("wpc-eval/src/fused_kernel.rs").read_text()
          assert "#[allow(dead_code)]\n#[allow(dead_code)]" not in text
          PY

      - name: Format
        run: cargo fmt --all

      - name: Validate build
        run: cargo build --workspace --release

      - name: Validate tests
        run: cargo test --workspace --release

      - name: Validate full Clippy gate
        run: cargo clippy --workspace --all-targets --all-features --release -- -D warnings

      - name: Persist validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes to persist."
          else
            git commit -m "[ai-repair] persist validated Rust CI fixes"
            git push origin HEAD:integration/full-organism-v2
          fi

      - name: Final status
        run: git status --short --branch
