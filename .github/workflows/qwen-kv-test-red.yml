name: Qwen KV Probe RED Gate

on:
  push:
    branches: [feature/memory-kv-real-model-bridge]

permissions:
  contents: write

jobs:
  add-red-test:
    if: "!contains(github.event.head_commit.message, '[qwen-kv-test-red]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add failing contract test
        shell: python
        run: |
          from pathlib import Path
          p = Path('wpc-runtime/src/qwen3_moe_model.rs')
          s = p.read_text()
          marker = "#[cfg(test)]\nmod tests {"
          test = "#[test]\n    fn kv_probe_can_be_installed_on_qwen_cache() {\n        let mut cache = MoeKvCache::new(1, 1, 2);\n        cache.set_kv_probe(None);\n    }\n\n"
          if 'fn kv_probe_can_be_installed_on_qwen_cache' in s:
              raise SystemExit('test already present')
          if marker not in s:
              raise SystemExit('test module anchor not found')
          s = s.replace(marker, marker + "\n    " + test, 1)
          p.write_text(s)
      - name: Commit RED test
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wpc-runtime/src/qwen3_moe_model.rs
          git commit -m 'test(qwen): add failing KV probe contract [qwen-kv-test-red]'
          git push
