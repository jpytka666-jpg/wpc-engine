name: One-shot repair

on:
  push:
    branches: [feature/forward-batch-gemm-bench]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'automated repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Normalize raw-pointer API
        shell: python
        run: |
          from pathlib import Path

          p = Path('wpc-runtime/src/forward_batch.rs')
          s = p.read_text()
          old = '    pub fn optimized_attention_batch(\n'
          new = '    pub unsafe fn optimized_attention_batch(\n'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)

          p = Path('wpc-runtime/tests/attention_correctness.rs')
          s = p.read_text()
          needle = 'engine.optimized_attention_batch('
          if needle in s and 'unsafe {\n        engine.optimized_attention_batch(' not in s:
              s = s.replace(
                  '    assert!(engine\n        .optimized_attention_batch(',
                  '    assert!(unsafe {\n        engine.optimized_attention_batch(',
                  1,
              )
              marker = '        .is_err());'
              pos = s.find(marker)
              if pos != -1:
                  s = s[:pos] + '        .is_err()\n    });' + s[pos + len(marker):]
              p.write_text(s)

      - name: Format
        run: cargo fmt --all

      - name: Verify
        run: |
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No repair changes needed.'
            exit 0
          fi
          git commit -m 'fix: repair CI formatting and raw pointer safety (automated repair)'
          git push
