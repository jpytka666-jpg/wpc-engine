name: Memory-Graph Implementation Gate

on:
  push:
    branches: ["stage2/memory-graph-contracts"]
  pull_request:
    branches: ["arch/memory-graph"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Memory-Graph
        run: cargo test -p aions-memory-graph
