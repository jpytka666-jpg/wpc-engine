name: AIONS Studio CI

on:
  push:
    branches:
      - feature/gui
  pull_request:
    paths:
      - 'studio-core/**'
      - 'studio-ui/**'
      - '.github/workflows/studio-ci.yml'
  workflow_dispatch:

jobs:
  studio-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test studio-core
        run: cargo test -p studio-core

  studio-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-ui/package.json
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install frontend dependencies
        run: npm install
      - name: Run frontend tests
        run: npm test
      - name: Typecheck and build frontend
        run: npm run build
      - name: Build AIONS Studio (Tauri Linux)
        run: npm run tauri build
