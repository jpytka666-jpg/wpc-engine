name: Memory KV Compression Experiment

timeout-minutes: 20

on:
  push:
    branches: ["feature/memory-kv-compression-experiment"]
  pull_request:
    branches: ["integration/full-organism-v2"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p aions-memory-kv --test compression_experiment --release
