name: AIONS Architecture - OS Integration
on:
  push:
    branches: ["arch/os-integration"]
  pull_request:
    branches: [main]
    paths: ["CLAUDE.md", "docs/**", ".github/workflows/arch-os-integration.yml"]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify contract
        run: |
          test -f CLAUDE.md
          test -f docs/MODULE-CONTRACT.md
          test -f docs/IMPLEMENTATION-STAGE-1.md
          grep -q "AIONS OS integration" docs/MODULE-CONTRACT.md
          grep -q "integration gate" docs/IMPLEMENTATION-STAGE-1.md
