name: CI

on:
  push:
    branches: [main, "integration/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --workspace --release
      - name: Test
        # The AVX2 kernels are gated at runtime; GitHub runners provide AVX2.
        run: cargo test --workspace --release
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy runtime
        run: cargo clippy -p wpc-runtime --all-targets --release -- -D warnings
      - name: Benchmark compile
        run: cargo bench -p wpc-runtime --bench attention_bench --no-run
      - name: Benchmark smoke
        run: cargo bench -p wpc-runtime --bench attention_bench -- --noplot --sample-size 10 --measurement-time 0.2
