name: Memory-KV Implementation Gate

on:
  push:
    branches: ["feature/memory-kv-implementation"]
  pull_request:
    branches: ["arch/memory-kv"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Memory-KV
        run: cargo test -p aions-memory-kv
