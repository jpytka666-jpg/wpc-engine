name: AIONS Unified Organism

on:
  push:
    branches: ["integration/full-organism-v2"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-organism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build entire Rust workspace
        run: cargo build --workspace --release
      - name: Test entire Rust workspace
        run: cargo test --workspace --release
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy unified runtime
        run: cargo clippy -p wpc-runtime --all-targets --release -- -D warnings
      - name: Unified cross-module smoke
        run: cargo test -p aions-organism-smoke --release

  agents-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust agents diagnostics
        run: cargo test -p aions-agents-ci --release
