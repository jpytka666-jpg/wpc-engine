[package]
name = "wpc-full-compiler"
version = "0.1.0"
edition = "2021"

[dependencies]
wpc-core = { path = "../wpc-core" }
wpc-format = { path = "../wpc-format" }
clap = { version = "4.4", features = ["derive"] }
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
safetensors = "0.4"
memmap2 = "0.9"
half = "2.4"
rand = "0.8"
rand_xoshiro = "0.6"
