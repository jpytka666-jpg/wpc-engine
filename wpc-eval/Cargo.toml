[package]
name = "wpc-eval"
version = "0.1.0"
edition = "2021"
description = "WPC encoder, codebook trainer, and Fused-SIMD-compatible evaluator for real .safetensors LLM layers."

[lib]
name = "wpc_eval"
path = "src/lib.rs"

[[bin]]
name = "wpc_eval"
path = "src/main.rs"

[dependencies]
wpc-format = { path = "../wpc-format" }
wpc-core = { path = "../wpc-core" }
half = "2.4"
rand = "0.8"
rand_xoshiro = "0.6"
rand_distr = "0.4"
byteorder = "1.5"
ndarray = "0.15"
safetensors = "0.4"
memmap2 = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
