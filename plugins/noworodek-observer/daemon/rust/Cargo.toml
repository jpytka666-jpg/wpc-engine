[package]
name = "noworodek-daemon"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "wieczna-nauka"
path = "src/bin/wieczna_nauka.rs"

[[bin]]
name = "karmiciel"
path = "src/bin/karmiciel.rs"

[[bin]]
name = "most"
path = "src/bin/most.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
