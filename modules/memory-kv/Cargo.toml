[package]
name = "aions-memory-kv"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wpc-core = { package = "wpc-core", path = "../../wpc-core" }
wpc-format = { package = "wpc-format", path = "../../wpc-format" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "hot_kv"
harness = false

[[bench]]
name = "compression_experiment"
harness = false
